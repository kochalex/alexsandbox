name: Echo CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: bash services/echo/build.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash services/echo/test.sh
