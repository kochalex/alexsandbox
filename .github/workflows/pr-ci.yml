name: PR CI POC

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-poc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Match changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/ci/paths.yml

      - name: Summarize affected services
        env:
          AFFECTED_SERVICES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail

          {
            echo "## Change detection"
            echo ""
            echo "| Service | Changed |"
            echo "| --- | --- |"

            while IFS= read -r service; do
              changed="$(jq -r --arg service "$service" 'index($service) != null' <<< "$AFFECTED_SERVICES")"
              service_label="$(tr '[:lower:]' '[:upper:]' <<< "${service:0:1}")${service:1}"
              echo "| $service_label | $changed |"
            done < <(yq -r 'keys | .[]' .github/ci/paths.yml)
          } >> "$GITHUB_STEP_SUMMARY"

  alpha:
    name: Alpha CI
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'alpha')
    uses: ./.github/workflows/ci-alpha.yml

  bravo:
    name: Bravo CI
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'bravo')
    uses: ./.github/workflows/ci-bravo.yml

  charlie:
    name: Charlie CI
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'charlie')
    uses: ./.github/workflows/ci-charlie.yml

  delta:
    name: Delta CI
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'delta')
    uses: ./.github/workflows/ci-delta.yml

  echo:
    name: Echo CI
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'echo')
    uses: ./.github/workflows/ci-echo.yml

  gate:
    name: PR CI / gate
    needs: [changes, alpha, bravo, charlie, delta, echo]
    if: always()
    uses: ./.github/workflows/ci-gate.yml
    with:
      results_json: ${{ toJSON(needs) }}
