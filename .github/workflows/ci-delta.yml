name: Delta CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash services/delta/build.sh

  test:
    name: Test (required, intentionally fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash services/delta/test.sh
