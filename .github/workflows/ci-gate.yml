name: PR CI gate

on:
  workflow_call:
    inputs:
      results_json:
        description: Serialized needs context from the PR CI orchestrator
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate results
    runs-on: ubuntu-latest
    env:
      RESULTS_JSON: ${{ inputs.results_json }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify affected and skipped services
        run: |
          set -euo pipefail

          changes_result="$(jq -r '.changes.result // "missing"' <<< "$RESULTS_JSON")"
          failures=0

          if [ "$changes_result" != "success" ]; then
            echo "::error::Change detection result was $changes_result"
            failures=1
          fi

          {
            echo "## PR CI gate"
            echo ""
            echo "| Service | Job | Changed | Required | Job status | CI result |"
            echo "| --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r service; do
            changed="$(
              jq -r --arg service "$service" \
                '(.changes.outputs.services // "[]" | fromjson) | index($service) != null' \
                <<< "$RESULTS_JSON"
            )"
            result="$(jq -r --arg service "$service" '.[$service].result // "missing"' <<< "$RESULTS_JSON")"
            service_label="$(tr '[:lower:]' '[:upper:]' <<< "${service:0:1}")${service:1}"

            while IFS= read -r job; do
              job_required="$(yq "(.jobs.$job.\"continue-on-error\" // false) == false" ".github/workflows/ci-$service.yml")"
              required="Yes"
              if [ "$job_required" != "true" ]; then
                required="No"
              fi

              if [ "$changed" = "true" ]; then
                job_result="$(jq -r --arg service "$service" --arg job "$job" '.[$service].outputs[$job + "_result"] // "missing"' <<< "$RESULTS_JSON")"
              else
                job_result="skipped"
              fi

              case "$job_result" in
                success) job_status="Passed" ;;
                skipped) job_status="Skipped" ;;
                failure) job_status="Failed" ;;
                cancelled) job_status="Cancelled" ;;
                *) job_status="Missing" ;;
              esac

              job_label="$(tr '[:lower:]' '[:upper:]' <<< "${job:0:1}")${job:1}"

              echo "| $service_label | $job_label | $changed | $required | $job_status | $job_result |" >> "$GITHUB_STEP_SUMMARY"
            done < <(yq -r '.jobs | keys | .[]' ".github/workflows/ci-$service.yml")

            if [ "$changed" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::$service CI should have run successfully, but result was $result"
              failures=1
            fi

            if [ "$changed" != "true" ] && [ "$result" != "skipped" ]; then
              echo "::error::$service CI should have been skipped, but result was $result"
              failures=1
            fi
          done < <(yq -r 'keys | .[]' .github/ci/paths.yml)

          if [ "$failures" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Gate failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Gate passed. Every affected service completed successfully." >> "$GITHUB_STEP_SUMMARY"
