name: Alpha CI

on:
  workflow_call:
    outputs:
      build_result:
        value: ${{ jobs.build.outputs.result }}
      test_result:
        value: ${{ jobs.test.outputs.result }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@v7
      - id: run
        run: bash services/alpha/build.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@v7
      - id: run
        run: bash services/alpha/test.sh
