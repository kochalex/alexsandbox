name: Bravo CI

on:
  workflow_call:
    outputs:
      build_result:
        value: ${{ jobs.build.outputs.result }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@v7
      - id: run
        run: bash services/bravo/build.sh
